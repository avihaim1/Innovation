name: AI Code Review

on:
  pull_request:
    branches:
      - main

jobs:
  code_review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run DeepCode Analysis
        uses: Snyk/deepcode-action@v1
        with:
          token: ${{ secrets.DEEPCODE_TOKEN }}
